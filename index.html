<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="效率工作台">
  <meta name="theme-color" content="#3B8BCC">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'%3E%3Cpath d='M30 8 Q28 4 35 4 Q42 6 42 52 L36 52 Q34 12 30 8 Z' fill='white' stroke='%232C2C2C' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M70 8 Q72 4 65 4 Q58 6 58 52 L64 52 Q66 12 70 8 Z' fill='white' stroke='%232C2C2C' stroke-width='3' stroke-linejoin='round'/%3E%3Cellipse cx='50' cy='72' rx='32' ry='30' fill='white' stroke='%232C2C2C' stroke-width='3'/%3E%3Ccircle cx='38' cy='68' r='3' fill='%232C2C2C'/%3E%3Ccircle cx='62' cy='68' r='3' fill='%232C2C2C'/%3E%3Cpath d='M44 84 L56 84 M50 78 L50 90' stroke='%232C2C2C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>个人效率工作台</title>
  <link rel="stylesheet" href="./css/styles.css?v=16">
</head>
<body>
  <div id="app">
    <nav id="tabBar" class="tab-bar">
      <div class="tab-logo"></div>
      <div class="tab-scroll" id="tabScroll"></div>
    </nav>
    <div id="alertBar" class="alert-bar" style="display:none;">
      <span id="alertText"></span>
      <button class="alert-close" onclick="App.hideAlert()">知道了</button>
    </div>
    <main id="mainContent" class="main-content"></main>
    <div id="quickBar" class="quick-bar">
      <input type="text" id="quickInput" class="quick-input" placeholder="✍️ 输入指令，如 /今日规划 /打卡 /历史上的今天 /刷新历史事件 /每天为什么..." autocomplete="off">
      <button id="quickSend" class="quick-send" onclick="App.handleQuickCommand()">发送</button>
      <button class="quick-settings" onclick="App.showSettingsModal()">⚙️</button>
    </div>
  </div>
  <div id="modalContainer" class="modal-container" style="display:none;">
    <div class="modal-mask" onclick="App.closeModal()"></div>
    <div id="modalContent" class="modal-content"></div>
  </div>
  <script src="./js/storage.js?v=12"></script>
  <script src="./js/today-in-history.js?v=10"></script>
  <script src="./js/daily-why.js?v=10"></script>
  <script src="./js/scheduler.js?v=10"></script>
  <script src="./js/app.js?v=16"></script>
</body>
</html>
