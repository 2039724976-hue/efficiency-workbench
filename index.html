<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="效率工作台">
  <meta name="theme-color" content="#3B8BCC">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'%3E%3Cellipse cx='33' cy='22' rx='7' ry='20' fill='white' stroke='%232C2C2C' stroke-width='3'/%3E%3Cellipse cx='67' cy='22' rx='7' ry='20' fill='white' stroke='%232C2C2C' stroke-width='3'/%3E%3Cellipse cx='50' cy='62' rx='30' ry='28' fill='white' stroke='%232C2C2C' stroke-width='3'/%3E%3Ccircle cx='39' cy='57' r='2.8' fill='%232C2C2C'/%3E%3Ccircle cx='61' cy='57' r='2.8' fill='%232C2C2C'/%3E%3Cpath d='M47 70 L53 70 M50 67 L50 73' stroke='%232C2C2C' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <title>个人效率工作台</title>
  <link rel="stylesheet" href="./css/styles.css?v=9">
</head>
<body>
  <div id="app">
    <nav id="tabBar" class="tab-bar">
      <div class="tab-logo"></div>
      <div class="tab-scroll" id="tabScroll"></div>
    </nav>
    <div id="alertBar" class="alert-bar" style="display:none;">
      <span id="alertText"></span>
      <button class="alert-close" onclick="App.hideAlert()">知道了</button>
    </div>
    <main id="mainContent" class="main-content"></main>
    <div id="quickBar" class="quick-bar">
      <input type="text" id="quickInput" class="quick-input" placeholder="✍️ 输入指令，如 /今日规划 /打卡 /历史上的今天 /刷新历史事件 /每天为什么..." autocomplete="off">
      <button id="quickSend" class="quick-send" onclick="App.handleQuickCommand()">发送</button>
      <button class="quick-settings" onclick="App.showSettingsModal()">⚙️</button>
    </div>
  </div>
  <div id="modalContainer" class="modal-container" style="display:none;">
    <div class="modal-mask" onclick="App.closeModal()"></div>
    <div id="modalContent" class="modal-content"></div>
  </div>
  <script src="./js/storage.js?v=9"></script>
  <script src="./js/today-in-history.js?v=9"></script>
  <script src="./js/daily-why.js?v=9"></script>
  <script src="./js/scheduler.js?v=9"></script>
  <script src="./js/app.js?v=9"></script>
</body>
</html>
